image: node:24-alpine

stages:
  - build
  - deploy

build:
  stage: build
  before_script:
    - apk add --no-cache zip
  script:
  - npm ci
  - npm run build-preview -- -- --base=./ # build preview for editor (relative base, required for epoc-editor's local preview and for the standalone/SCORM export reusing the same artifact)
  - cd dist && rm -rf ./assets/demo && zip -r ../preview.zip ./* && cd - # zip editor preview
  artifacts:
    expire_in: 1 week
    paths:
    - preview.zip
    - dist
  only:
  - master

